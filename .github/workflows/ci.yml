name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "integration/**"
      - "release/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: console/web
      - name: Run console web tests
        run: npm test
        working-directory: console/web
      - name: Build console web
        run: npm run build
        working-directory: console/web

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dune
          POSTGRES_PASSWORD: dune
          POSTGRES_DB: dune
        ports:
          - 15432:5432
        options: >-
          --health-cmd="pg_isready -U dune"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/api/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: console/api
      - name: Run console API tests
        # Several integration suites create and remove isolated PostgreSQL
        # databases. Keep test files serial in CI so one suite cannot terminate
        # another suite's connection during database cleanup.
        run: node --test --test-concurrency=1 test/*.test.js
        working-directory: console/api

  metrics-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run metrics stack unit tests
        run: bash tests/metrics-stack-unit.sh

  runtime-script-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install secrets test dependencies
        timeout-minutes: 8
        run: |
          if command -v gpg >/dev/null 2>&1 \
            && command -v age >/dev/null 2>&1 \
            && python3 -c 'from cryptography.hazmat.primitives.ciphers.aead import AESGCM' >/dev/null 2>&1; then
            gpg --version
            age --version
            exit 0
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends age gnupg python3-cryptography
          gpg --version
          age --version
          python3 -c 'from cryptography.hazmat.primitives.ciphers.aead import AESGCM'
      - name: Test readiness with configured service ports
        run: bash tests/ready-configured-ports-test.sh
      - name: Test stable farm readiness gating
        run: bash tests/farm-readiness-test.sh
      - name: Test database updater role restoration
        run: bash tests/update-db-role-privilege-test.sh
      - name: Test installer shell portability
        run: |
          dash -n install.sh
          docker run --rm -v "$PWD/install.sh:/install.sh:ro" alpine:3.22 /bin/ash -n /install.sh
          tests/install-docker-progress-test.sh
      - name: Test partition combat-state resolver
        run: python3 runtime/scripts/test_partition_combat_state.py
      - name: Test UserEngine.ini comment placement
        run: python3 runtime/scripts/test_userengine_ini_comments.py
      - name: Test Global/Map/Partition override precedence
        run: python3 runtime/scripts/test_profile_override_precedence.py
      - name: Test multi-server config helper
        run: python3 runtime/scripts/test_multi_server_config.py
      - name: Test combat-state publishers
        run: |
          runtime/tests/test-deepdesert-combat-state-publication.sh
          runtime/tests/test-deepdesert-overrides-combat-state-publication.sh
          runtime/tests/test-deepdesert-startup-publisher-consistency.sh
          runtime/tests/test-sietch-combat-state-publication.sh
      - name: Test runtime safety regressions
        run: |
          runtime/tests/test-command-auth-token.sh
          runtime/tests/test-bind-ip-resolution.sh
          runtime/tests/test-deepdesert-dual-startup-reconcile.sh
          runtime/tests/test-deepdesert-dual-selector-cleanup.sh
          runtime/tests/test-director-log-id-normalization.sh
          tests/fls-signals-test.sh
          tests/steamcmd-signals-test.sh
          tests/storage-cleanup-test.sh
          tests/fake-k8s-serviceaccount-cleanup-test.sh
          tests/runtime-permission-helper-rebuild-test.sh
          tests/update-systemd-timer-health-test.sh
          tests/memory-status-effective-defaults-test.sh
          tests/always-on-memory-safety-test.sh
          tests/autoscaler-browser-heal-safety-test.sh
          tests/autoscaler-igw-socket-health-test.sh
          tests/db-backup-validation-test.sh
          tests/battlegroup-identity-test.sh
          tests/db-system-backup-test.sh
      - name: Test Compose project-name portability
        run: |
          runtime/tests/test-compose-project-name-portability.sh
          runtime/tests/test-compose-project-resolution.sh
          runtime/tests/test-container-compose-labels.sh
      - name: Test age-based secrets library (AEAD primitive, shell seam, cross-language round-trip)
        run: |
          python3 runtime/scripts/lib/test_secrets_aead.py -v
          runtime/tests/test-secrets-lib.sh
          runtime/tests/test-secrets-aead-cross-language.sh
          runtime/tests/test-secrets-stage2.sh

  container-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test non-root container lifecycle and permission migration
        run: bash tests/container-lifecycle-test.sh

  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Add upstream remote
        run: git remote add upstream https://github.com/Red-Blink/dune-awakening-selfhost-docker.git
      - name: Fetch upstream
        run: git fetch upstream main
      # gitleaks and trivy are installed explicitly here because
      # tests/security-pr-checks.sh fails OPEN when either binary is
      # missing (prints "SKIP: <tool> is not installed" and still exits
      # 0) -- on a fresh ubuntu-latest runner neither ships preinstalled,
      # so without this step the job reported success while its secret
      # scan silently never ran. See security-pr-checks.sh's own
      # command -v guards for why a missing binary must not be treated
      # as "nothing to report."
      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Install trivy
        run: |
          curl -sL https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
          echo "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Run security PR checks
        run: bash tests/security-pr-checks.sh

  api-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/api/package-lock.json
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: console/api

  # Go vulnerability scanning for the only Go component in this repo.
  # Reachable-call-graph aware (not just "is this version listed"), so it
  # catches real, exploitable stdlib/dependency CVEs that npm audit and
  # generic SCA tools cannot see at all for this component. See
  # docs/security/ci-security-tooling.md for the tool inventory this gate
  # belongs to and why each tool here exists.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: runtime/public-probe/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Run govulncheck against runtime/public-probe
        run: govulncheck ./...
        working-directory: runtime/public-probe

  # Dockerfile linting for every Dockerfile in this repo. See
  # .hadolint.yaml for the two rule classes deliberately ignored
  # (OS-package version pinning, non-numeric container users) and why.
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install hadolint
        run: |
          curl -sL https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 -o /usr/local/bin/hadolint
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /usr/local/bin/hadolint" | sha256sum -c -
          chmod +x /usr/local/bin/hadolint
      - name: Lint Dockerfiles
        run: |
          hadolint --config .hadolint.yaml orchestrator/Dockerfile
          hadolint --config .hadolint.yaml console/api/Dockerfile
          hadolint --config .hadolint.yaml runtime/public-probe/Dockerfile

  # Broader multi-ecosystem SCA than `npm audit` alone -- covers the Go
  # module (runtime/public-probe) and both npm projects (console/api,
  # console/web) from OSV's cross-ecosystem advisory database, as a
  # defense-in-depth complement to govulncheck (call-graph-aware but
  # Go-only) and npm audit (npm-only).
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
      - name: Scan source dependencies
        run: osv-scanner scan source --recursive .

  # Builds the real console runtime image and scans it with the same
  # command issue #54 used for its one-off manual finding -- promoted
  # here to a standing, recurring gate rather than an ad hoc check, per
  # that issue's own "the gate must remain visible and time-boxed"
  # intent. Known, currently-unfixable-upstream findings (e.g. a
  # not-yet-patched Debian package with no available fix) are suppressed
  # by CVE ID in .trivyignore with a dated justification comment, not by
  # disabling the gate -- a new, real finding still fails this job.
  trivy-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build console image
        run: docker build -f console/api/Dockerfile -t redblink-dune-docker-console:ci .
      - name: Install trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.73.0
      - name: Scan console image
        run: trivy image --scanners vuln,secret --severity HIGH,CRITICAL --ignorefile .trivyignore --exit-code 1 redblink-dune-docker-console:ci

  release-validation:
    name: Release validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate release package and fresh extraction
        run: bash tests/release-gate-test.sh

  release-gate:
    name: Release gate
    if: ${{ always() }}
    needs:
      - web-tests
      - api-tests
      - metrics-unit
      - runtime-script-unit
      - container-lifecycle
      - security-checks
      - api-dependency-audit
      - govulncheck
      - hadolint
      - osv-scanner
      - trivy-image-scan
      - release-validation
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check to pass
        env:
          WEB_TESTS: ${{ needs.web-tests.result }}
          API_TESTS: ${{ needs.api-tests.result }}
          METRICS_UNIT: ${{ needs.metrics-unit.result }}
          RUNTIME_SCRIPT_UNIT: ${{ needs.runtime-script-unit.result }}
          CONTAINER_LIFECYCLE: ${{ needs.container-lifecycle.result }}
          SECURITY_CHECKS: ${{ needs.security-checks.result }}
          API_DEPENDENCY_AUDIT: ${{ needs.api-dependency-audit.result }}
          GOVULNCHECK: ${{ needs.govulncheck.result }}
          HADOLINT: ${{ needs.hadolint.result }}
          OSV_SCANNER: ${{ needs.osv-scanner.result }}
          TRIVY_IMAGE_SCAN: ${{ needs.trivy-image-scan.result }}
          RELEASE_VALIDATION: ${{ needs.release-validation.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "$WEB_TESTS" \
            "$API_TESTS" \
            "$METRICS_UNIT" \
            "$RUNTIME_SCRIPT_UNIT" \
            "$CONTAINER_LIFECYCLE" \
            "$SECURITY_CHECKS" \
            "$API_DEPENDENCY_AUDIT" \
            "$GOVULNCHECK" \
            "$HADOLINT" \
            "$OSV_SCANNER" \
            "$TRIVY_IMAGE_SCAN" \
            "$RELEASE_VALIDATION"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more required release checks did not pass."
            exit 1
          fi
          echo "All required release checks passed."
