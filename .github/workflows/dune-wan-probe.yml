name: Dune Sustained WAN Probe

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Public IP or hostname of the Dune server to probe. No default -- every operator running this fork has a different one; leaving one hardcoded here would only ever probe a single specific host and would publish its address in a public fork (dune-awakening-selfhost-docker#143)."
        required: true
        type: string
      tcp_port:
        description: "Web Console TCP port to test."
        required: false
        type: string
        default: "31982"
      udp_ports:
        description: "Comma-separated game-server UDP ports to send test traffic to."
        required: false
        type: string
        default: "7777,7778,7779"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test TCP and repeatedly send UDP
        shell: python
        env:
          PROBE_HOST: ${{ inputs.host }}
          PROBE_TCP_PORT: ${{ inputs.tcp_port }}
          PROBE_UDP_PORTS: ${{ inputs.udp_ports }}
        run: |
          import os
          import socket
          import time
          import urllib.request

          host = os.environ["PROBE_HOST"]
          tcp_port = int(os.environ["PROBE_TCP_PORT"])
          udp_ports = [int(p) for p in os.environ["PROBE_UDP_PORTS"].split(",") if p.strip()]

          runner_ip = urllib.request.urlopen(
              "https://api.ipify.org",
              timeout=10,
          ).read().decode().strip()

          print(f"RUNNER_IP={runner_ip}", flush=True)

          for attempt in range(1, 11):
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.settimeout(5)

              try:
                  started = time.monotonic()
                  sock.connect((host, tcp_port))
                  elapsed = time.monotonic() - started
                  print(
                      f"TCP_SUCCESS attempt={attempt} "
                      f"elapsed={elapsed:.3f}",
                      flush=True,
                  )
              except Exception as exc:
                  print(
                      f"TCP_FAILURE attempt={attempt} error={exc}",
                      flush=True,
                  )
              finally:
                  sock.close()

              time.sleep(1)

          print("Starting 60-second UDP transmission", flush=True)

          for sequence in range(1, 61):
              for port in udp_ports:
                  sock = socket.socket(
                      socket.AF_INET,
                      socket.SOCK_DGRAM,
                  )

                  payload = (
                      f"DUNE_GITHUB_PROBE "
                      f"runner={runner_ip} "
                      f"sequence={sequence} "
                      f"port={port}"
                  ).encode()

                  try:
                      sock.sendto(payload, (host, port))
                  finally:
                      sock.close()

              print(
                  f"UDP_SEQUENCE_SENT={sequence}",
                  flush=True,
              )
              time.sleep(1)

          print("Probe complete", flush=True)
