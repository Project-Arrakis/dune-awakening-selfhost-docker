repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ggshield
        name: ggshield
        entry: ggshield secret scan pre-commit
        language: system
        pass_filenames: false
        always_run: true
        verbose: false

      - id: trivy
        name: trivy
        entry: trivy fs --scanners secret --severity HIGH,CRITICAL --ignorefile .trivyignore .
        language: system
        pass_filenames: false
        always_run: true
        verbose: false

      - id: semgrep
        name: semgrep
        # Deliberately NOT pass_filenames: false / always_run: true.
        # Those two settings together mean semgrep receives no file
        # arguments on every commit and falls back to scanning the
        # entire repository regardless of what was staged -- any
        # pre-existing finding anywhere in the repo then blocks every
        # subsequent commit, even ones that never touch the affected
        # files. Letting pre-commit's default pass_filenames: true pass
        # only the staged files restores a fast, scoped local-commit
        # tier. Full-ruleset, Supply-Chain-aware coverage still runs in
        # CI via .github/workflows/semgrep.yml on every PR/push/
        # schedule, unaffected by this change.
        entry: semgrep --error --config p/default
        language: system
        verbose: false

      - id: security-pr-checks
        name: Security checks
        entry: bash tests/security-pr-checks.sh
        language: system
        pass_filenames: false
        files: ^(console|runtime|docker-compose|\.env)
