 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Atrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f12;
  --bg-card: #1a1510;
  --text: #f3efe7;
  --text-dim: #ad9f89;
  --accent: #e8a84c;
  --border: #302b25;
  --border-focus: #c68b4a;
  --danger: #a74949;
  --success: #3d8b62;
  --font-body: 'Inter', sans-serif;
  --font-heading: 'Marcellus', serif;
  --font-mono: ui-monospace, 'SF Mono', 'Consolas', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 20px;
  max-width: 1100px;
  margin: 0 auto;
  min-height: 100vh;
}
h1, h2, h3 { font-family: var(--font-heading); font-weight: 400; }
h1 { color: var(--accent); font-size: 1.5rem; margin-bottom: 4px; letter-spacing: 0.05em; }
h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--text); }
.subtitle { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 24px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}
.form-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.form-group { flex: 1; min-width: 180px; }
.form-group label {
  display: block;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-bottom: 4px;
}
input, select {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 0.85rem;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--border-focus);
}
input::placeholder { color: #555; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 6px;
  border: none;
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #0d0f12; }
.btn-secondary { background: #302b25; color: var(--text); }
.btn-danger { background: var(--danger); color: var(--text); }
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}
th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 0.7rem;
}
td {
  padding: 6px 10px;
  border-bottom: 1px solid rgba(48, 43, 37, 0.5);
  white-space: nowrap;
}
tr:hover td { background: rgba(232, 168, 76, 0.05); }
tr.selected td { background: rgba(232, 168, 76, 0.12); }
.status-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
}
.badge-placeable { background: rgba(61, 139, 98, 0.2); color: var(--success); }
.badge-vehicle { background: rgba(232, 168, 76, 0.2); color: var(--accent); }
.msg {
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 0.85rem;
  display: none;
}
.msg-error { display: block; background: rgba(167, 73, 73, 0.15); color: #d47c7c; border: 1px solid rgba(167, 73, 73, 0.3); }
.msg-success { display: block; background: rgba(61, 139, 98, 0.15); color: var(--success); border: 1px solid rgba(61, 139, 98, 0.3); }
.msg-info { display: block; background: rgba(232, 168, 76, 0.1); color: var(--accent); border: 1px solid rgba(232, 168, 76, 0.2); }
.hidden { display: none; }
.help-text { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }
.item-picker { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.item-picker .form-group { flex: 0 1 auto; }
.qty-input { width: 100px !important; }
.col-type { width: 80px; }
.footer-bar { margin-top: 40px; text-align: center; font-size: 0.7rem; color: #444; }
@media (max-width: 600px) {
  .form-row { flex-direction: column; }
  .form-group { min-width: 100%; }
  .item-picker { flex-direction: column; }
  .item-picker .form-group { width: 100%; }
  .qty-input { width: 100% !important; }
  td, th { font-size: 0.7rem; padding: 4px 6px; }
}
</style>
</head>
<body>

<h1>Atrium</h1>
<p class="subtitle">Console operations panel</p>

<div id="msg" class="msg" role="alert"></div>

<div id="toolPanel" class="hidden">
  <div class="card">
    <h2>Storage Containers</h2>
    <div class="form-row" style="margin-bottom:12px">
      <div class="form-group" style="min-width:200px">
        <label for="playerFilter">Owner</label>
        <select id="playerFilter">
          <option value="__all__">All players</option>
        </select>
      </div>
      <button class="btn btn-secondary" id="btnRefresh">Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-type">Type</th>
            <th>Name</th>
            <th>Map</th>
            <th>Owner</th>
            <th>Items</th>
            <th>Volume</th>
          </tr>
        </thead>
        <tbody id="storageBody"></tbody>
      </table>
    </div>
    <p class="help-text" id="storageHelp">Click a row to select a container.</p>
  </div>

  <div class="card">
    <h2>Fill Container</h2>
    <p class="help-text" style="margin-bottom:8px">
      Selected container: <span id="selectedInfo" style="color:var(--accent)">none</span>
    </p>
    <div class="item-picker">
      <div class="form-group" style="flex:2">
        <label for="itemSelect">Item</label>
        <select id="itemSelect">
          <option value="">— connect to load items —</option>
        </select>
      </div>
      <div class="form-group">
        <label for="qty">Qty (leave empty = fill to max)</label>
        <input type="number" id="qty" class="qty-input" min="0" placeholder="max">
      </div>
      <button class="btn btn-primary" id="btnFill">Fill</button>
    </div>
    <div id="fillResult" class="hidden" style="margin-top:12px"></div>
  </div>

  <div class="card" id="itemPanel" style="display:none">
    <h2>Container Contents</h2>
    <p class="help-text" style="margin-bottom:8px">
      <span id="itemContainerInfo" style="color:var(--accent)">none</span>
      — <span id="itemCount">0 items</span>
    </p>
    <div class="form-row" style="margin-bottom:8px">
      <button class="btn btn-danger" id="btnRemoveSelected" disabled>Remove Selected</button>
      <button class="btn btn-danger" id="btnEmptyContainer" disabled>Empty Container</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:40px"><input type="checkbox" id="selectAllItems" title="Select all"></th>
            <th>Template</th>
            <th style="width:80px">Qty</th>
            <th style="width:60px"></th>
          </tr>
        </thead>
        <tbody id="itemBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer-bar">—</div>

<script src="atrium.js"></script>
</body>
</html>
