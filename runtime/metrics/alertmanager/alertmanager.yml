global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'discord-relay'
  routes:
    - match:
        severity: critical
      receiver: 'discord-relay'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'discord-relay'
      repeat_interval: 8h

receivers:
  - name: 'discord-relay'
    webhook_configs:
      - url: 'https://acp-setup.darkdante.org/api/alerts/relay'
        send_resolved: true
