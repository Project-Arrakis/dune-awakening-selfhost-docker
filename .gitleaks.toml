# Gitleaks configuration for dune-awakening-selfhost-docker
# The built-in fallback token is intentionally hardcoded
# to match the game server's expected default.
# See: console/api/src/rmq.js BUILTIN_COMMAND_AUTH_TOKEN

# Keep Gitleaks' maintained detection rules when this repository config is
# selected explicitly (for example, by tests/security-pr-checks.sh).
[extend]
  useDefault = true

# CORRECTION (2026-08-21, issue #458): the [[allowlists]] (plural)
# migration below was reverted. It was written anticipating gitleaks
# v8.25.0+'s newer config schema, but every gitleaks invocation in this
# project is pinned to v8.24.3 -- and v8.24.3's actual ViperConfig struct
# (confirmed directly against its source) has no top-level `Allowlists`
# (plural) field at all; that field only exists nested under a specific
# [[rules]] entry (i.e. [[rules.allowlists]]), not at the file's top
# level. Viper silently drops unrecognized top-level TOML keys, so this
# block had zero effect in every gitleaks run that used it -- verified
# directly: even runtime/scripts/command-auth-token.sh, the file this
# allowlist's own description names as the canonical intentional case,
# was still being flagged. detect.go's actual scan loop only ever
# consults `Config.Allowlist` (singular) at the top level. Reverted to
# the singular [allowlist] table below, which v8.24.3 does parse and
# apply. If this project's pinned gitleaks version is ever upgraded to
# v8.25.0+, re-verify whether [[allowlists]] (plural) is viable again
# before switching back -- don't assume the original migration comment
# was simply wrong forever, it may become correct once the version pin
# changes.
[allowlist]
  description = "Verified placeholders / synthetic fixtures (checked 2026-08-06)"
  regexes = [
    "Nu6VmPWUMvdPMeB7qErr",
    "123456789012345678",
    "143064109775060993",
    "abcdefghijklmnopqrstuvwxyzABCDEFG123456"
  ]

# NOTE: tests/db-system-backup-test.sh's synthetic secret fixtures
# (admin-pw-8f2a-real, etc.) do NOT need an allowlist entry here --
# confirmed directly: `gitleaks detect --source
# tests/db-system-backup-test.sh` with the built-in default rules (and no
# fixture-specific allowlist at all) already produces zero findings, since
# these fixtures' variable names (SECRET_ADMIN_PASSWORD=, TEST_PASSPHRASE=)
# don't match any built-in rule's keyword+pattern requirements. A broad,
# permanent, repo-wide allowlist entry for these exact literal strings was
# added defensively in an earlier revision without verifying this -- an
# unverified assumption, not a fact, per this account's own review
# discipline. Removed rather than kept "just in case."
