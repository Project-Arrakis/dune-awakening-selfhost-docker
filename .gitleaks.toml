# Gitleaks configuration for dune-awakening-selfhost-docker
# The built-in fallback token is intentionally hardcoded
# to match the game server's expected default.
# See: console/api/src/rmq.js BUILTIN_COMMAND_AUTH_TOKEN

# Keep Gitleaks' maintained detection rules when this repository config is
# selected explicitly (for example, by tests/security-pr-checks.sh).
[extend]
  useDefault = true

[allowlist]
  description = "Verified placeholders / synthetic fixtures (checked 2026-08-06)"
  regexes = [
    "Nu6VmPWUMvdPMeB7qErr",
    "123456789012345678",
    "143064109775060993",
    "abcdefghijklmnopqrstuvwxyzABCDEFG123456",
    # Synthetic secret fixtures planted by tests/db-system-backup-test.sh to
    # verify an encrypted system backup retains every credential correctly
    # through a real decrypt round-trip, and that the wrong passphrase
    # never decrypts it. Not real secrets; deliberately shaped to look like
    # ones so the test exercises realistic content (checked 2026-08-15).
    "admin-pw-8f2a-real",
    "sietch-pw-9f2a-real",
    "funcom-token-77bb-real",
    "correct-horse-battery-staple-9f2a"
  ]
