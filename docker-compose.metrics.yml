services:
  dune-prometheus:
    image: ${METRICS_PROMETHEUS_IMAGE:-quay.io/prometheus/prometheus:v3.5.0}
    container_name: dune-prometheus
    restart: unless-stopped
    networks:
      - dune-net
    ports:
      - "127.0.0.1:${METRICS_PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRICS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${METRICS_RETENTION_SIZE:-2GB}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ./runtime/metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./runtime/metrics/rules:/etc/prometheus/rules:ro
      - dune-prometheus-data:/prometheus
    security_opt:
      - no-new-privileges:true

  dune-node-exporter:
    image: ${METRICS_NODE_EXPORTER_IMAGE:-quay.io/prometheus/node-exporter:v1.9.1}
    container_name: dune-node-exporter
    restart: unless-stopped
    networks:
      - dune-net
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/docker/netns|var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|pstore|rpc_pipefs|securityfs|sysfs|tracefs)$$
    pid: host
    volumes:
      # Avoid :rslave by default because WSL/Docker Desktop root mounts may not be shared/slave mounts.
      - /:/host:ro
    security_opt:
      - no-new-privileges:true

  dune-cadvisor:
    image: ${METRICS_CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.52.1}
    container_name: dune-cadvisor
    restart: unless-stopped
    networks:
      - dune-net
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  dune-postgres-exporter:
    image: ${METRICS_POSTGRES_EXPORTER_IMAGE:-quay.io/prometheuscommunity/postgres-exporter:v0.17.1}
    container_name: dune-postgres-exporter
    restart: unless-stopped
    networks:
      - dune-net
    environment:
      DATA_SOURCE_URI: dune-postgres:5432/dune?sslmode=disable
      DATA_SOURCE_USER: ${DUNE_DB_USER:-dune}
      DATA_SOURCE_PASS: ${DUNE_DB_PASSWORD:-dune}
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
    security_opt:
      - no-new-privileges:true

  # ── Alertmanager: alert routing to Discord ──
  dune-alertmanager:
    image: ${METRICS_ALERTMANAGER_IMAGE:-quay.io/prometheus/alertmanager:v0.28.0}
    container_name: dune-alertmanager
    restart: unless-stopped
    networks:
      - dune-net
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
    volumes:
      - ./runtime/metrics/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # yacketrj/arrakis-control-panel#167: shared secret sent as this
      # receiver's Authorization: Bearer header (see alertmanager.yml's
      # discord-relay receiver). Must match the bot's own
      # DUNE_ALERT_RELAY_TOKEN/_FILE exactly. See
      # docs/runtime/METRICS-ALERTMANAGER-DISCORD-RELAY.md for setup --
      # this file does not exist until an operator creates it, which is
      # deliberate: Alertmanager fails closed (refuses to start) rather
      # than silently sending unauthenticated requests if it's missing.
      - ./runtime/secrets/alert-relay-token.txt:/etc/alertmanager/secrets/alert-relay-token.txt:ro
      - dune-alertmanager-data:/alertmanager

  # ── Grafana: dashboards (DevOps / NOC / SOC) ──
  dune-grafana:
    image: ${METRICS_GRAFANA_IMAGE:-grafana/grafana:11.1.0}
    container_name: dune-grafana
    restart: unless-stopped
    networks:
      - dune-net
    ports:
      # METRICS_GRAFANA_BIND_HOST follows the same pattern as
      # ADMIN_BIND_HOST (docker-compose.web.yml): default stays
      # 127.0.0.1 so this is a zero-behavior-change default for every
      # existing operator (Grafana ships with anonymous viewer access
      # enabled below, so localhost-only is the safe default). Set it
      # to 0.0.0.0 or a specific host IP only if you intentionally want
      # Grafana reachable beyond this host (e.g. behind a reverse proxy
      # or tunnel) and have set a real METRICS_GRAFANA_PASSWORD below.
      - "${METRICS_GRAFANA_BIND_HOST:-127.0.0.1}:${METRICS_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${METRICS_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${METRICS_GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_INSTALL_PLUGINS: ""
    volumes:
      - dune-grafana-data:/var/lib/grafana
      - ./runtime/metrics/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./runtime/metrics/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./runtime/metrics/grafana/dashboard-definitions:/var/lib/grafana/dashboards:ro
      - ./runtime/metrics/grafana/grafana.ini:/etc/grafana/grafana.ini:ro

networks:
  dune-net:
    external: true

volumes:
  dune-prometheus-data:
  dune-alertmanager-data:
  dune-grafana-data:
